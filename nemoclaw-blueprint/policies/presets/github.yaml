#
# GitHub access preset.
#
# Until #1583 was fixed, github.com / api.github.com plus the git binary
# were silently included in the base sandbox policy, so every sandbox
# could clone, push, and call the GitHub API regardless of what the user
# opted into. Moving the entry into a discoverable preset restores
# least-privilege: a sandbox only gets GitHub if the user explicitly
# selects this preset during `nemoclaw onboard` (or applies it later via
# `openshell policy set`).
#
# Node-based tools and the GitHub CLI also call the GitHub API and fetch raw
# GitHub content in the active v12 runtime. The sandbox image installs `gh`, so
# this preset includes its API and device-flow helper endpoints.

preset:
  name: github
  description: "GitHub.com, GitHub API, raw GitHub content, and gh CLI access"

network_policies:
  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
        access: full
      - host: api.github.com
        port: 443
        access: full
      - host: raw.githubusercontent.com
        port: 443
        access: full
      - host: cafe.github.com
        port: 443
        access: full
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/bin/gh }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
