preset:
  name: xai
  description: "xAI API access for web search and API-backed tools"

network_policies:
  xai:
    name: xai
    endpoints:
      - host: api.x.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
