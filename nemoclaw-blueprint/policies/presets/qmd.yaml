preset:
  name: qmd
  description: "QMD memory backend model and package access"

network_policies:
  qmd:
    name: qmd
    endpoints:
      - host: huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: cdn-lfs.huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: cas-bridge.xethub.hf.co
        port: 443
      - host: router.huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/bin/python3* }
